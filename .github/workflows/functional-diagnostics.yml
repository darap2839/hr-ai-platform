name: "Stage 1: Functional diagnostic tool"
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/functional-diagnostics.py'
      - 'scripts/run-functional-diagnostics.ps1'
      - 'scripts/tests/test_functional_diagnostics.py'
      - 'scripts/tests/run-functional-diagnostics.Tests.ps1'
      - '.github/workflows/functional-diagnostics.yml'
  pull_request:
    paths:
      - 'scripts/functional-diagnostics.py'
      - 'scripts/run-functional-diagnostics.ps1'
      - 'scripts/tests/test_functional_diagnostics.py'
      - 'scripts/tests/run-functional-diagnostics.Tests.ps1'
      - '.github/workflows/functional-diagnostics.yml'
permissions:
  contents: read
concurrency:
  group: functional-tool-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tool-regressions:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test ownership, cleanup and failure reporting
        run: python -m unittest discover -s scripts/tests -p test_functional_diagnostics.py -v
      - name: Test Windows PowerShell wrapper and recovery
        shell: powershell
        run: ./scripts/tests/run-functional-diagnostics.Tests.ps1
      - name: Test PowerShell 7 wrapper and recovery
        shell: pwsh
        run: ./scripts/tests/run-functional-diagnostics.Tests.ps1
