name: "Stage 1: Diagnostics"
run-name: "Stage 1 diagnostics / ${{ github.ref_name }} / ${{ github.sha }}"

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'docs/diagnostics/**'
      - '.github/workflows/diagnostics.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'docs/diagnostics/**'
      - '.github/workflows/diagnostics.yml'

permissions:
  contents: read

concurrency:
  group: diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: diagnostic
          POSTGRES_PASSWORD: diagnostic
          POSTGRES_DB: diagnostic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diagnostic -d diagnostic"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://diagnostic:diagnostic@localhost:5432/diagnostic
      PYTHONPATH: .
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: diagnostic
      MINIO_SECRET_KEY: diagnostic-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: mkdir -p reports
      - run: python -m pip install -r requirements.txt
      - name: Record tested version and dependencies
        run: |
          git rev-parse HEAD > reports/commit.txt
          python --version > reports/python.txt
          python -m pip freeze > reports/dependencies.txt
      - name: Check migration graph
        run: python -m alembic heads | tee reports/migration-heads.txt
      - name: Apply migrations to empty PostgreSQL
        run: python -m alembic upgrade head 2>&1 | tee reports/migrations.log
      # Storage operations are mocked in unit tests; real MinIO needs the live stack.
      - name: Execute backend suite
        if: ${{ !cancelled() }}
        run: python -m pytest --junitxml=reports/junit.xml --cov-report=xml:reports/coverage.xml --cov-report=term-missing
      - name: Save backend evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-1-backend-${{ github.sha }}
          path: backend/reports/
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: mkdir -p reports
      - run: npm ci --no-audit --no-fund
      - name: Record tested version and dependencies
        run: |
          git rev-parse HEAD > reports/commit.txt
          node --version > reports/node.txt
          npm ls --depth=0 > reports/dependencies.txt
      - name: Run frontend tests
        run: npm run test:run -- --reporter=default --reporter=junit --outputFile=reports/junit.xml
      - name: Build frontend
        if: ${{ !cancelled() }}
        run: npm run build 2>&1 | tee reports/build.log
      - name: Save frontend evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-1-frontend-${{ github.sha }}
          path: frontend/reports/
          if-no-files-found: warn

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate both Compose profiles without starting services
        run: |
          docker compose config --quiet
          docker compose --profile ai config --quiet
      - name: Explain diagnostic scope
        run: |
          echo 'Compose syntax checked. Full-stack authentication, file storage and real Qwen inference require a separate deployed test environment.' >> "$GITHUB_STEP_SUMMARY"
